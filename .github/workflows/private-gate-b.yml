name: Private Balance Gate B

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-model-100k:
    name: 100k-action recovery model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: >-
          cargo +1.97.1 test --release --locked
          -p private-balance-test-support --test model_actions
          one_hundred_thousand_seeded_actions_recover_exactly_and_detect_corruption
          -- --ignored --exact
        working-directory: protocol/private-balance
