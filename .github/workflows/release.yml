name: Release

on:
  push:
    tags:
      - "v*"

env:
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  private-circuits:
    name: Private Balance Circuit Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CIVER_SOURCE_COMMIT: af7d4ed0325e6f7743d8a1ac0e415d0c69b8aae8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: protocol/private-balance/circuits/package-lock.json
      - run: corepack install
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build pinned CIVER analyzer
        run: |
          git clone --no-checkout https://github.com/costa-group/circom_civer.git "$RUNNER_TEMP/circom_civer"
          git -C "$RUNNER_TEMP/circom_civer" checkout --detach "$CIVER_SOURCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/circom_civer" rev-parse HEAD)" = "$CIVER_SOURCE_COMMIT"
          cargo +1.97.1 build --manifest-path "$RUNNER_TEMP/circom_civer/Cargo.toml" --release -p civer_circom
      - run: cargo +1.97.1 install --git https://github.com/iden3/circom.git --tag v2.2.3 --locked circom
      - run: cargo +1.97.1 install circomspect --version 0.9.0 --locked
      - run: cargo +1.97.1 test --workspace --locked
        working-directory: protocol/private-balance
      - run: cargo +1.97.1 install cargo-deny --version 0.20.2 --locked
      - run: cargo +1.97.1 deny check
        working-directory: protocol/private-balance
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: corepack npm --prefix protocol/private-balance/circuits audit --audit-level=high
      - run: npm run private:gate-a
        env:
          CIVER_CIRCOM: ${{ runner.temp }}/circom_civer/target/release/civer_circom

  private-artifacts:
    name: Private Balance Canonical Artifacts
    # macos-15 is the GitHub-hosted ARM64 image; the Rust host is checked too.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: protocol/private-balance/circuits/package-lock.json
      - run: corepack install
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup target add wasm32v1-none --toolchain 1.97.1
      - run: cargo +1.97.1 install --git https://github.com/iden3/circom.git --tag v2.2.3 --locked circom
      - uses: ./.github/actions/setup-stellar-cli
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: npm run private:check-reproducible

  private-gate-a:
    name: Private Balance Gate A
    needs: [private-circuits, private-artifacts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require circuit and canonical-artifact success
        env:
          CIRCUIT_RESULT: ${{ needs.private-circuits.result }}
          ARTIFACT_RESULT: ${{ needs.private-artifacts.result }}
        run: |
          test "$CIRCUIT_RESULT" = success
          test "$ARTIFACT_RESULT" = success

  release:
    needs: private-gate-a
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: corepack install
      - run: corepack npm ci
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: ./.github/actions/setup-stellar-cli
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/assert-clean-release.mjs --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
      - name: Verify the shared application gate and clean release
        run: npm run release:verify
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
      - run: node scripts/create-release-artifact.mjs --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*
      - name: Publish exact verified files
        run: >-
          gh release create "$GITHUB_REF_NAME" release-artifacts/*
          --verify-tag
          --generate-notes
          --title "StellarKey ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://stellarkey.io
    steps:
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="stellarkey-${version}.tar.gz"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern "stellarkey-${version}.cdx.json" \
            --pattern "release-files.json" \
            --pattern "SHA256SUMS"
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)" = "true"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
          mkdir deploy
          tar -xzf "$archive" --strip-components=1 -C deploy
          test "$(node -p "require('./deploy/release.json').commit")" = "$GITHUB_SHA"
      - name: Deploy exact release to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"
          command: >-
            pages deploy deploy --project-name=stellarkey --branch=main
            --commit-hash=${{ github.sha }}
