name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: corepack install
      - run: corepack npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/assert-clean-release.mjs --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
      - run: npm run release:verify
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
      - run: node scripts/create-release-artifact.mjs --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-artifacts/*
      - name: Publish exact verified files
        run: >-
          gh release create "$GITHUB_REF_NAME" release-artifacts/*
          --verify-tag
          --generate-notes
          --title "StellarKey ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://stellarkey.io
    steps:
      - name: Download and verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="stellarkey-${version}.tar.gz"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern "stellarkey-${version}.cdx.json" \
            --pattern "release-files.json" \
            --pattern "SHA256SUMS"
          sha256sum --check SHA256SUMS
          mkdir deploy
          tar -xzf "$archive" --strip-components=1 -C deploy
          test "$(node -p "require('./deploy/release.json').commit")" = "$GITHUB_SHA"
      - name: Deploy exact release to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"
          command: >-
            pages deploy deploy --project-name=stellarkey --branch=main
            --commit-hash=${{ github.sha }} --commit-message=${{ github.ref_name }}
