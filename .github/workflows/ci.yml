name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

permissions:
  contents: read

jobs:
  private-circuits:
    name: Private Balance Circuit Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CIVER_SOURCE_COMMIT: af7d4ed0325e6f7743d8a1ac0e415d0c69b8aae8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: protocol/private-balance/circuits/package-lock.json
      - run: corepack install
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build pinned CIVER analyzer
        run: |
          git clone --no-checkout https://github.com/costa-group/circom_civer.git "$RUNNER_TEMP/circom_civer"
          git -C "$RUNNER_TEMP/circom_civer" checkout --detach "$CIVER_SOURCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/circom_civer" rev-parse HEAD)" = "$CIVER_SOURCE_COMMIT"
          cargo +1.97.1 build --manifest-path "$RUNNER_TEMP/circom_civer/Cargo.toml" --release --locked -p civer_circom
      - run: cargo +1.97.1 install --git https://github.com/iden3/circom.git --tag v2.2.3 --locked circom
      - run: cargo +1.97.1 install circomspect --version 0.9.0 --locked
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: corepack npm --prefix protocol/private-balance/circuits audit --audit-level=high
      - run: npm run private:gate-a
        env:
          CIVER_CIRCOM: ${{ runner.temp }}/circom_civer/target/release/civer_circom

  private-artifacts:
    name: Private Balance Canonical Artifacts
    # macos-15 is the GitHub-hosted ARM64 image; the Rust host is checked too.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: protocol/private-balance/circuits/package-lock.json
      - run: corepack install
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup target add wasm32v1-none --toolchain 1.97.1
      - run: cargo +1.97.1 install --git https://github.com/iden3/circom.git --tag v2.2.3 --locked circom
      - uses: ./.github/actions/setup-stellar-cli
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: npm run private:check-reproducible

  private-gate-a:
    name: Private Balance Gate A
    needs: [private-circuits, private-artifacts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require circuit and canonical-artifact success
        env:
          CIRCUIT_RESULT: ${{ needs.private-circuits.result }}
          ARTIFACT_RESULT: ${{ needs.private-artifacts.result }}
        run: |
          test "$CIRCUIT_RESULT" = success
          test "$ARTIFACT_RESULT" = success

  private-rust-security:
    name: Private Balance Rust Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup component add rustfmt --toolchain 1.97.1
      - run: cargo +1.97.1 fmt --all -- --check
        working-directory: protocol/private-balance
      - run: cargo +1.97.1 test --workspace --locked
        working-directory: protocol/private-balance
      - run: cargo +1.97.1 install cargo-deny --version 0.20.2 --locked
      - run: cargo +1.97.1 deny --config deny.toml check
        working-directory: protocol/private-balance

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: corepack install
      - run: corepack npm ci
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: ./.github/actions/setup-stellar-cli
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify:application:core
      - run: npm run verify:application:production
      - run: test -f out/index.html

  private-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop-chromium, iphone-webkit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: corepack install
      - run: corepack npm ci
      - run: corepack npm --prefix protocol/private-balance/circuits ci
      - run: rustup toolchain install 1.97.1 --profile minimal
      - uses: ./.github/actions/setup-stellar-cli
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run private:check-generated
      - run: npm run test:e2e:private-ui
      - run: npm run test:e2e:private-components -- --project="$BROWSER_PROJECT" && npm run check:fixture-clean
        env:
          BROWSER_PROJECT: ${{ matrix.browser }}

  verify:
    needs: [application, private-ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every application verification lane
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          PRIVATE_UI_RESULT: ${{ needs.private-ui.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$PRIVATE_UI_RESULT" = success
