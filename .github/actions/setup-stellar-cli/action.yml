name: Set up verified Stellar CLI
description: Install the pinned official release after checking every cached or downloaded archive.
runs:
  using: composite
  steps:
    - name: Install Linux runtime libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libdbus-1-3 libudev1
    - name: Cache pinned CLI archives
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.tool_cache }}/stellarkey-cli-archives
        key: stellar-cli-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-stellar-cli.mjs') }}
    - name: Verify archive and install the pinned CLI
      shell: bash
      env:
        STELLAR_CLI_CACHE: ${{ runner.tool_cache }}/stellarkey-cli-archives
        STELLAR_CLI_INSTALL_ROOT: ${{ runner.temp }}
      run: node scripts/ci/install-stellar-cli.mjs --cache-dir "$STELLAR_CLI_CACHE" --install-root "$STELLAR_CLI_INSTALL_ROOT"
