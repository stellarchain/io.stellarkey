[package]
name = "private-balance-pool"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=27.0.6", default-features = false, features = ["hazmat-address"] }
soroban-poseidon = { git = "https://github.com/stellar/rs-soroban-poseidon", tag = "v27.0.0", default-features = false }
private-balance-protocol = { path = "../../crates/protocol", default-features = false }
private-balance-verifier = { path = "../../crates/verifier" }

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["hazmat-address", "testutils"] }
soroban-env-host = "=27.0.1"
private-balance-test-support = { path = "../../crates/test-support" }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = "0.4"
sha2 = "=0.10.9"
