[package]
name = "private-balance-spikes"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
soroban-sdk = { version = "=27.0.6", features = ["hazmat-crypto", "testutils"] }
soroban-poseidon = { git = "https://github.com/stellar/rs-soroban-poseidon", tag = "v27.0.0" }
ark-bn254 = "0.6.0"
ark-groth16 = "0.6.0"
ark-snark = "0.6.0"
ark-relations = "0.6.0"
ark-ff = "0.6.0"
ark-ec = "0.6.0"
ark-std = "0.6.0"
num-bigint = "0.4.8"
sha2 = "0.10.8"
hkdf = "0.12.4"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hpke = "0.14.0"
rand = "0.8.5"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[[bin]]
name = "poseidon"
path = "src/bin/poseidon.rs"

[[bin]]
name = "archive"
path = "src/bin/archive.rs"
