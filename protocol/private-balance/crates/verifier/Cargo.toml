[package]
name = "private-balance-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
soroban-sdk = { version = "=27.0.6", default-features = false }
private-balance-protocol = { path = "../protocol", default-features = false }
num-bigint = { version = "0.4", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }
hex = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
num-bigint = "0.4"
